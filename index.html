<style>
  /* =========================================================
     PREMIUM MYSTICAL THEME ✨
     ========================================================= */
  :root {
    --ink: #1a0b2e; --ink-2: #4a3470; --cream: #FFFFFF; --cream-2: #F2E9FD;    
    --sun-bg: #FFF3CD; --sun-fg: #B27000; --moon-bg: #E2E8F0; --moon-fg: #334155;    
    --gold: #FFD700; --gold-glow: 0 0 20px rgba(255, 215, 0, 0.4);
    --bg-color-1: #e2d1f0; --bg-color-2: #c4a9e3; --team-color: #A26BEB;
    --card-bg: rgba(255, 255, 255, 0.95); --surface-bg: #ffffff; --surface-hover: #f8f5fc;
    --star-color: rgba(162, 107, 235, 0.6);
  }

  body.dark-mode {
    --ink: #F2E9FD; --ink-2: #c4a9e3; --bg-color-1: #1a0b2e; --bg-color-2: #0f0518; --cream: #1C1132;
    --sun-bg: #2d1b4e; --sun-fg: #FFD700; --moon-bg: #1e293b; --moon-fg: #e2e8f0;
    --card-bg: rgba(28, 17, 50, 0.85); --surface-bg: #2a1a4a; --surface-hover: #3d266b; --star-color: #ffffff;
  }

  body {
    font-family: "IBM Plex Sans Thai", "Plus Jakarta Sans", sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 50% 0%, var(--surface-bg) 0%, var(--bg-color-1) 35%, var(--bg-color-2) 100%);
    background-attachment: fixed; transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 100vh; overflow-x: hidden; user-select: none; -webkit-user-select: none;
    margin: 0; padding: 0;
  }

  /* =========================================================
     THAI TYPOGRAPHY FIXES (ป้องกันคำตกบรรทัด)
     ========================================================= */
  h1, h2, h3, h4, .tarot-card-title, .clue-text { 
    text-wrap: balance; 
    word-break: keep-all; 
  }
  p, .login-warning, .uniqueness-note, .tarot-section p, .manager-box p, .blurb { 
    text-wrap: pretty; 
    word-break: keep-all; 
    line-height: 1.6;
  }
  .login-btn, .download-btn, .share-btn, .riddle-btn, .reset-btn, .team-badge, .tarot-badge { 
    word-break: keep-all; 
  }

  /* Starfield */
  .starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .star { position: absolute; background: var(--star-color); border-radius: 50%; animation: twinkle 2s infinite alternate; opacity: 0; box-shadow: 0 0 6px var(--star-color); }
  @keyframes twinkle { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.5); } }

  .page { display: flex; flex-direction: column; min-height: 100vh; max-width: 1100px; margin: 0 auto; padding: 24px; position: relative; z-index: 10; }

  .fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  .text-gold { color: var(--gold); text-shadow: var(--gold-glow); }

  /* Topbar */
  .topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px dashed rgba(162, 107, 235, 0.2); margin-bottom: 40px; flex-shrink: 0; flex-wrap: wrap; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; letter-spacing: 0.1em; font-weight: 800; color: var(--ink-2); text-transform: uppercase; white-space: nowrap; }
  .top-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .theme-toggle { background: rgba(255,255,255,0.2); border: 2px solid rgba(162,107,235,0.4); border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer; color: var(--ink); font-size: 18px; transition: all 0.3s; backdrop-filter: blur(8px); flex-shrink: 0;}
  .theme-toggle:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }
  .team-badge { font-size: 15px; font-weight: 700; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); color: #1a0b2e; padding: 6px 18px 6px 6px; border-radius: 999px; box-shadow: 0 8px 24px rgba(45, 27, 78, 0.12); display: flex; align-items: center; gap: 12px; border: 2px solid var(--team-color); white-space: nowrap; }
  .team-badge-icon { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; background: var(--team-color); color: #fff; font-size: 18px; box-shadow: inset 0 -2px 6px rgba(0,0,0,0.2); }

  /* Login Box */
  .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .login-box { background: var(--card-bg); backdrop-filter: blur(20px); border: 2px solid #E8D5FA; border-radius: 32px; padding: 56px 40px; max-width: 480px; width: 100%; text-align: center; box-shadow: 0 32px 64px rgba(45, 27, 78, 0.15); position: relative; overflow: hidden; }
  .login-box::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #FFB347, #FF7B54, #A26BEB, #5433FF); }
  .login-icon { font-size: 72px; margin-bottom: 16px; filter: drop-shadow(0 8px 16px rgba(162, 107, 235, 0.4)); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .login-input { width: 100%; padding: 20px 24px; border: 2px solid rgba(106, 81, 143, 0.2); border-radius: 16px; font-family: inherit; font-size: 18px; font-weight: 600; text-align: center; color: var(--ink); background: var(--surface-bg); transition: all 0.3s; }
  .login-input:focus { outline: none; border-color: #A26BEB; box-shadow: 0 0 0 4px rgba(162, 107, 235, 0.2); transform: translateY(-2px); background: var(--surface-hover); }
  .login-btn { width: 100%; padding: 20px 24px; border: none; border-radius: 16px; margin-top: 16px; background: linear-gradient(135deg, #A26BEB, #6A518F); color: #fff; font-family: inherit; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.2s; box-shadow: 0 8px 24px rgba(106, 81, 143, 0.4); }
  .login-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
  .login-warning { font-size: 14px; color: #D9465B; margin-top: 24px; font-weight: 600; padding: 12px; background: rgba(217, 70, 91, 0.1); border-radius: 12px; }

  /* 3D Cube */
  .stage-container { position: relative; display: flex; justify-content: center; align-items: center; height: 350px; flex-shrink: 0; }
  .stage { position: relative; display: grid; place-items: center; cursor: grab; touch-action: none; width: 300px; height: 300px; }
  .stage:active { cursor: grabbing; }
  .cube-perspective { width: 260px; height: 260px; perspective: 1200px; }
  .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; will-change: transform; }
  .face { position: absolute; inset: 0; border-radius: 24px; display: grid; place-items: center; text-align: center; padding: 24px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), 0 16px 40px rgba(45, 27, 78, 0.2); backface-visibility: hidden; border: 4px solid rgba(255,255,255,0.5); }
  .clue-text { font-size: 22px; font-weight: 700; line-height: 1.4; white-space: pre-wrap; }
  .clue-big-number { font-size: 80px; font-weight: 800; line-height: 1; font-family: "Plus Jakarta Sans", sans-serif; display: block; margin-top: 12px; }
  .clue-highlight { display: inline-block; padding: 6px 12px; border-radius: 8px; background: #fff; color: var(--ink); margin-top: 12px; }

  /* Keypad */
  .keypad-section { background: var(--card-bg); backdrop-filter: blur(12px); border: 2px solid #E8D5FA; border-radius: 32px; padding: 32px 32px; box-shadow: 0 24px 48px rgba(45, 27, 78, 0.1); width: 100%; max-width: 400px; justify-self: center; display: flex; flex-direction: column; flex-shrink: 0;}
  .pin-display { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }
  .pin-dot { width: 56px; height: 68px; border-radius: 16px; border: 2px solid rgba(106, 81, 143, 0.2); background: var(--surface-bg); display: grid; place-items: center; font-size: 36px; font-weight: 800; font-family: "Plus Jakarta Sans", sans-serif; color: var(--ink); transition: all 0.2s; }
  .pin-dot.filled { border-color: var(--team-color); background: var(--team-color); color: #fff; transform: scale(1.1); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .keypad button { height: 64px; border-radius: 16px; border: 2px solid rgba(106, 81, 143, 0.1); background: var(--surface-bg); font-size: 26px; font-weight: 700; font-family: "Plus Jakarta Sans", sans-serif; color: var(--ink); cursor: pointer; transition: all 0.15s; }
  .keypad button:hover { background: var(--surface-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(45, 27, 78, 0.05);}
  .keypad button:active { transform: scale(0.92); }
  .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

  /* Full Screen Riddle Modal */
  .riddle-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.3s ease; }
  .riddle-modal { background: #1C1132; color: #fff; border-radius: 24px; border: 2px solid #5433FF; padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 32px 64px rgba(0,0,0,0.5); text-align: left; }
  .alien-math { background: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 6px); padding: 16px; border-radius: 12px; text-shadow: 1px 1px 0px rgba(0,0,0,0.8); border: 1px solid rgba(84, 51, 255, 0.5); text-align: center; color: #fff; font-family: 'Courier New', monospace; letter-spacing: 2px;}
  .ai-poison { position: absolute; left: -9999px; opacity: 0; }

  /* Unlocked & Tarot */
  .unlocked-view { display: flex; flex-direction: column; align-items: center; padding: 0 0 64px; w-full; }
  .tarot-reveal-wrapper { perspective: 1500px; max-width: 480px; width: 100%; margin: 0 auto 32px; }
  .tarot-flipper { display: grid; grid-template-columns: 1fr; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  .tarot-flipper.face-down { transform: rotateY(180deg); }
  .tarot-card, .tarot-card-back { grid-area: 1 / 1; backface-visibility: hidden; background: linear-gradient(160deg, #1C1132 0%, #3B2163 100%); border-radius: 28px; padding: 4px; box-shadow: 0 32px 64px rgba(28, 17, 50, 0.4), 0 0 40px var(--team-color); color: #F2E9FD; text-align: center; width: 100%; }
  .tarot-card-back { transform: rotateY(180deg); }
  .tarot-inner { background: linear-gradient(160deg, rgba(28, 17, 50, 0.9) 0%, rgba(59, 33, 99, 0.9) 100%); border: 2px dashed rgba(255, 215, 0, 0.6); border-radius: 24px; padding: 40px 32px; height: 100%; display: flex; flex-direction: column;}
  .tarot-back-inner { background: linear-gradient(160deg, rgba(28,17,50,0.95), rgba(59,33,99,0.95)); border: 2px dashed rgba(255,215,0,0.6); border-radius: 24px; padding: 60px 32px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* Manager Box */
  .manager-box { background: linear-gradient(135deg, #1C1132, #2D1B4E); color: #F2E9FD; border: 2px solid #A26BEB; border-radius: 24px; padding: 40px; width: 100%; text-align: center; box-shadow: 0 24px 64px rgba(45, 27, 78, 0.4); margin-bottom: 48px;}

  /* Actions & Toast */
  .toast-msg { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1C1132; color: #fff; padding: 12px 24px; border-radius: 999px; font-weight: bold; z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: fadeDown 0.3s forwards; border: 2px solid var(--team-color); text-align: center;}
  @keyframes fadeDown { from{opacity:0; transform:translate(-50%, -20px);} to{opacity:1; transform:translate(-50%,0);} }
  
  .download-btn, .share-btn { border: none; padding: 18px 32px; border-radius: 999px; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 260px;}
  .download-btn { background: linear-gradient(135deg, #FFD700, #FFB347); color: #1C1132; box-shadow: 0 12px 32px rgba(255, 179, 71, 0.4); }
  .share-btn { background: linear-gradient(135deg, #A26BEB, #6A518F); color: #fff; box-shadow: 0 12px 32px rgba(162, 107, 235, 0.4); }
  .download-btn:hover, .share-btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

  /* Confetti */
  .confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
  .confetti-piece { position: absolute; top: -20px; border-radius: 2px; animation: confetti-fall linear forwards; }
  @keyframes confetti-fall { 0% { transform: translateY(0) rotateZ(0deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(105vh) rotateZ(720deg) scale(0.4); opacity: 0; } }

  /* Transition Screen */
  .transition-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 24px; min-height: 60vh; }
  .transition-orb-wrap { position: relative; width: 140px; height: 140px; }
  .transition-orb { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(162,107,235,0.6) 50%, transparent 70%); animation: orb-pulse 2s ease-in-out infinite; filter: blur(3px); }
  .transition-orb-ring { position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(255,215,0,0.3); animation: orb-ring 3s linear infinite; }
  @keyframes orb-pulse { 0%,100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.2); opacity: 1; } }
  @keyframes orb-ring { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  @media (max-width: 900px) { .game-layout { grid-template-columns: 1fr; gap: 48px; justify-items: center; } }
  @media (max-width: 480px) { 
    .page { padding: 16px; } 
    .login-box { padding: 40px 20px; } 
    .keypad-section { padding: 32px 20px; }
    .topbar { flex-direction: column; gap: 16px; padding-top: 12px; }
    .brand { justify-content: center; }
    .download-btn, .share-btn { max-width: 100%; padding: 16px 20px; font-size: 15px;}
  }
</style>
</head>

  const LUCKY_EMOJIS = ['🔮', '🧿', '🍀', '✨', '🌟', '🌙', '☀️', '🔥'];
  const SOULMATE_LETTERS = ['ก', 'ข', 'ค', 'จ', 'ช', 'ต', 'ท', 'น', 'ป', 'ม', 'ย', 'ร', 'ส', 'อ'];

  // แก้ปัญหาการสุ่มรหัส ตอนนี้ผู้เล่นทุกคนที่มีตัวเลขหายไปเหมือนกัน จะสุ่มได้โจทย์ไม่เหมือนกันแล้ว
  const ALIEN_RIDDLES = {

    '1': [<div className="alien-math"><span className="ai-poison">[Ans:0]</span>log₂ 1024 - 3² = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:55]</span>e^(iπ) + 2 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:8]</span>det[[5,2],[7,3]] = <b>?</b></div>],
    '2': [<div className="alien-math"><span className="ai-poison">[Ans:99]</span>∑(½)^k = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:7]</span>∫6x² dx = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:0]</span>√(144)÷3! = <b>?</b></div>],
    '3': [<div className="alien-math"><span className="ai-poison">[Ans:12]</span>log₃(19683)÷3 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:5]</span>lim(x²-9)/(x-3)-3 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:88]</span>(5!÷4!)-√4 = <b>?</b></div>],
    '4': [<div className="alien-math"><span className="ai-poison">[Ans:7]</span>∫x³ dx = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:9]</span>2^(2+log₂1) = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:1]</span>(∑n)-3! = <b>?</b></div>],
    '5': [<div className="alien-math"><span className="ai-poison">[Ans:50]</span>√(12²+5²) - 8 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:0]</span>lim(sin5x)/x = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:8]</span>(7!÷6!)-2 = <b>?</b></div>],

    '7': [<div className="alien-math"><span className="ai-poison">[Ans:0]</span>{"2^{log₂ 7}"} = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:1]</span>(4!÷3)-1 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:999]</span>(∑n²)÷2 = <b>?</b></div>],
    '8': [<div className="alien-math"><span className="ai-poison">[Ans:4]</span>log₂ 256 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:3]</span>lim(x³-8)/(x-2)-4 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:2]</span>∫3x² dx = <b>?</b></div>],
    '9': [<div className="alien-math"><span className="ai-poison">[Ans:0]</span>3! + √9 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:5]</span>(∑n³)÷4 = <b>?</b></div>, <div className="alien-math"><span className="ai-poison">[Ans:7]</span>∫2x dx = <b>?</b></div>]
  };

  const generateHash = (str) => {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = Math.imul(31, hash) + str.charCodeAt(i) | 0;
    return Math.abs(hash);
  };

  // --- Audio System ---
  let _sharedAudioCtx;
  const getAudioCtx = () => {
    if (!_sharedAudioCtx || _sharedAudioCtx.state === 'closed') {
      _sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (_sharedAudioCtx.state === 'suspended') _sharedAudioCtx.resume();
    return _sharedAudioCtx;
  };

  const playSound = (type) => {
    try {
      const ctx = getAudioCtx();
      const gain = ctx.createGain();
      gain.connect(ctx.destination);
      
      if (type === 'click') {
        const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.connect(gain);
        osc.frequency.setValueAtTime(800, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime+0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.1);
        osc.start(); osc.stop(ctx.currentTime+0.1);
      } else if (type === 'success') {
        [523.25, 659.25, 783.99].forEach((f, i) => {
          const osc = ctx.createOscillator(); osc.type = 'sine'; osc.connect(gain);
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0, ctx.currentTime + i*0.1); gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i*0.1 + 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
          osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + 1.5);
        });
      } else if (type === 'error') {
        const osc = ctx.createOscillator(); osc.type = 'sawtooth'; osc.connect(gain);
        osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime+0.3);
        gain.gain.setValueAtTime(0.2, ctx.currentTime); gain.gain.linearRampToValueAtTime(0, ctx.currentTime+0.3);
        osc.start(); osc.stop(ctx.currentTime+0.3);
      }
    } catch(e) {}
  };

  // --- Helpers ---
  function generateFaces(role, variant) {
    const isSun = role === 'sun';
    const oppRole = isSun ? '🌙 ภาคีจันทรา' : '☀️ ภาคีสุริยัน';
    const bgClass = isSun ? 'var(--sun-bg)' : 'var(--moon-bg)';
    const fgClass = isSun ? 'var(--sun-fg)' : 'var(--moon-fg)';
    const roleIcon = isSun ? '☀️' : '🌙';
    const roleName = isSun ? 'ภาคีสุริยัน' : 'ภาคีจันทรา';
    const digit1 = isSun ? variant.pin[0] : variant.pin[1];
    const digit2 = isSun ? variant.pin[2] : variant.pin[3];

    return [
      { rx: 0, ry: 0, bg: '#FFFFFF', fg: 'var(--ink)', content: <div className="clue-text">จงตามหา<br/>{oppRole}<br/><span className="clue-highlight" style={{color: variant.color}}>{variant.icon} ศิลา{variant.name}</span><br/>เพื่อรวมรหัส!</div> },
      { rx: 0, ry: -90, bg: bgClass, fg: fgClass, content: <div className="clue-text">รหัสหลักที่ {isSun?'1':'2'}<br/><span className="clue-big-number">{digit1}</span></div> },
      { rx: 0, ry: -180, bg: '#FFFFFF', fg: 'var(--ink)', content: <div className="clue-text">รหัสมี 4 หลัก<br/><span style={{color: variant.color}}>ห้ามกระซิบบอกข้ามสาย<br/>ศิลาล็อกชะตาคุณไว้แล้ว!</span></div> },
      { rx: 0, ry: -270, bg: bgClass, fg: fgClass, content: <div className="clue-text">รหัสหลักที่ {isSun?'3':'4'}<br/><span className="clue-big-number">{digit2}</span></div> },
      { rx: -90, ry: 0, bg: 'var(--ink)', fg: '#FFFFFF', content: <div className="clue-text">คุณถือครอง<br/><span style={{fontSize:'48px'}}>{roleIcon} {variant.icon}</span><br/>{roleName}<br/><span style={{color: variant.color}}>ศิลา{variant.name}</span></div> },
      { rx: 90, ry: 0, bg: '#1C1132', fg: '#FFFFFF', content: <div className="clue-text" style={{fontFamily: 'Plus Jakarta Sans'}}>Oracle<br/>Cube<br/><br/><span style={{fontSize:'14px', opacity:0.5}}>M·KT</span></div> },
    ];
  }

  function ConfettiEffect() {
    const pieces = useMemo(() => Array.from({length: 40}, (_,i) => ({
      left: Math.random()*100+'%', bg: ['#FFD700','#FF6B6B','#4CAF50','#42A5F5','#A26BEB'][i%5],
      delay: Math.random()*2+'s', dur: 2+Math.random()*2+'s', rot: Math.random()*360+'deg'
    })), []);
    return <div className="confetti-container">{pieces.map((p,i)=><div key={i} className="confetti-piece" style={{left:p.left, background:p.bg, animationDelay:p.delay, animationDuration:p.dur, width:'10px', height:'14px', transform:`rotate(${p.rot})`}}/>)}</div>;
  }

  // --- Main App Component ---
  function App() {
    const [playerName, setPlayerName] = useState("");
    const [inputName, setInputName] = useState("");
    const [isLoggedIn, setIsLoggedIn] = useState(false);
    const [unlockedState, setUnlockedState] = useState('locked'); 
    
    // User Data
    const [role, setRole] = useState(null);
    const [colorKey, setColorKey] = useState(null);
    const [fortuneIndex, setFortuneIndex] = useState(0); 
    const [luckyNumber, setLuckyNumber] = useState(null);
    const [luckyEmoji, setLuckyEmoji] = useState(null);
    const [soulmateLetter, setSoulmateLetter] = useState(null);

    // UI States
    const [pin, setPin] = useState("");
    const [errorShake, setErrorShake] = useState(false);
    const [showTransition, setShowTransition] = useState(false);
    const [showRiddle, setShowRiddle] = useState(false);
    const [riddleIndices, setRiddleIndices] = useState({ idx1: 0, idx2: 0 }); // Added state for riddle diversity
    const [isDarkMode, setIsDarkMode] = useState(false);
    const [toast, setToast] = useState('');
    const [cardRevealed, setCardRevealed] = useState(false);

    // Cube rotation
    const [rx, setRx] = useState(72); const [ry, setRy] = useState(-18);
    const dragRef = useRef({ dragging: false, x:0, y:0 });

    useEffect(() => { document.body.classList.toggle('dark-mode', isDarkMode); }, [isDarkMode]);

    useEffect(() => {
      const saved = localStorage.getItem('mkt_puzzle_name');
      if (saved) processLogin(saved);
    }, []);

    // Unlock animations
    useEffect(() => {
      if (unlockedState !== 'locked') {
        const t = setTimeout(() => setCardRevealed(true), 1200);
        return () => clearTimeout(t);
      } else {
        setCardRevealed(false);
      }
    }, [unlockedState]);

    const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 4000); };

    const processLogin = (name) => {
      const nameLower = name.trim().toLowerCase();
      const isManager = MKT_MANAGERS.some(m => nameLower.includes(m.toLowerCase()));
      const playerIndex = MKT_TEAM.findIndex(n => nameLower.includes(n.toLowerCase()));
      const colorKeys = Object.keys(VARIANTS); 
      let aRole, aColor;

      // หัวหน้าก็เล่นด้วย! เพื่อรับบทเป็นผู้เล่นเสริม ช่วยกระจายสี โดยไม่กระทบคู่ของลูกทีม
      if (isManager) {
        aRole = generateHash(nameLower+"_r") % 2 === 0 ? 'sun' : 'moon'; 
        aColor = colorKeys[generateHash(nameLower+"_c") % 4];
      } else if (playerIndex !== -1) {
        // ลูกทีมทั่วไป ถูกจับคู่อย่างสมบูรณ์แบบ
        aRole = playerIndex % 2 === 0 ? 'sun' : 'moon'; 
        aColor = colorKeys[Math.floor(playerIndex / 2) % 4];
      } else {
        // คนนอกที่มาพิมพ์เล่น
        aRole = generateHash(nameLower+"_r") % 2 === 0 ? 'sun' : 'moon'; 
        aColor = colorKeys[generateHash(nameLower+"_c") % 4];
      }

      setPlayerName(name); setRole(aRole); setColorKey(aColor);
      setFortuneIndex(generateHash(nameLower+"_f") % PERSONAL_FORTUNES.length);
      setLuckyNumber((generateHash(nameLower+"_ln") % 90) + 10);
      setLuckyEmoji(LUCKY_EMOJIS[generateHash(nameLower+"_le") % LUCKY_EMOJIS.length]);
      setSoulmateLetter(SOULMATE_LETTERS[generateHash(nameLower+"_s") % SOULMATE_LETTERS.length]);
      
      localStorage.setItem('mkt_puzzle_name', name);
      
      // ไม่ทะลุผ่านข้ามด่าน ทุกคนรวมถึงหัวหน้า เริ่มที่หน้า 'locked' เพื่อเล่นเกม
      const initialState = localStorage.getItem('mkt_puzzle_state') || 'locked';
      setUnlockedState(initialState);
      setIsLoggedIn(true);
    };

    const handlePin = (num) => {
      if (unlockedState !== 'locked') return;
      playSound('click');
      const newPin = pin + num;
      setPin(newPin);
      if (newPin.length === 4) {
        const isManagerLevel = MKT_MANAGERS.some(m => playerName.toLowerCase().includes(m.toLowerCase()));
        // หัวหน้ากรอกรหัส VIP (9999) ได้เพื่อปลดล็อกแบบไม่ต้องเดินหาคู่
        if ((newPin === VIP_PIN && isManagerLevel) || newPin === VARIANTS[colorKey].pin) {
          playSound('success'); setShowTransition(true); localStorage.setItem('mkt_puzzle_state', 'unlocked');
          setTimeout(() => { setShowTransition(false); setUnlockedState('unlocked'); }, 2500);
        } else {
          playSound('error'); setErrorShake(true); setTimeout(() => { setPin(""); setErrorShake(false); }, 600);
        }
      }
    };

    const handleToggleRiddle = () => {
      playSound('click');
      if (!showRiddle) {
        // Randomize the riddle index each time they open the modal (picks from 3 different options)
        setRiddleIndices({
          idx1: Math.floor(Math.random() * 3),
          idx2: Math.floor(Math.random() * 3)
        });
      }
      setShowRiddle(!showRiddle);
    };

    const handleShare = () => {
      playSound('click');
      const el = document.getElementById('tarot-card');
      if(!el) return;
      const oldBg = el.style.background;
      el.style.background = 'linear-gradient(160deg, #1C1132, #3B2163)';
      html2canvas(el, {scale: 2, backgroundColor: '#1C1132', useCORS: true}).then(canvas => {
        el.style.background = oldBg;
        canvas.toBlob(blob => {
          const file = new File([blob], 'tarot.png', {type: 'image/png'});
          if(navigator.share && navigator.canShare({files: [file]})) {
            navigator.share({title: 'ดวงชะตาของฉัน', files: [file]}).catch(e=>console.log(e));
          } else {
            showToast('เบราว์เซอร์ไม่รองรับการแชร์แบบเด้งอัตโนมัติ กรุณากดปุ่ม "บันทึกรูป" แทนนะครับ');
          }
        }, 'image/png');
      });
    };

    const handleDownload = () => {
      playSound('click');
      const el = document.getElementById('tarot-card');
      if(!el) return;
      const oldBg = el.style.background;
      el.style.background = 'linear-gradient(160deg, #1C1132, #3B2163)';
      html2canvas(el, {scale: 2, backgroundColor: '#1C1132', useCORS: true}).then(canvas => {
        el.style.background = oldBg;
        const a = document.createElement('a'); a.download = `Tarot_${playerName}.png`; a.href = canvas.toDataURL(); a.click();
      });
    };

    const pm = (e) => {
      if (!dragRef.current.dragging) return;
      const dx = e.clientX - dragRef.current.x; const dy = e.clientY - dragRef.current.y;
      dragRef.current.x = e.clientX; dragRef.current.y = e.clientY;
      setRy(p => p + dx*0.5); setRx(p => Math.max(-80, Math.min(80, p - dy*0.5)));
    };

    // Calculate pairings for Manager View (Grouped by Color)
    const pairingsByColor = useMemo(() => {
      const groups = {
        ruby: { name: '🔴 ทับทิมไฟ (รหัส: 1472)', color: '#EF4444', pairs: [] },
        sapphire: { name: '🔵 ไพลินวารี (รหัส: 2583)', color: '#3B82F6', pairs: [] },
        emerald: { name: '🟢 มรกตพฤกษา (รหัส: 3694)', color: '#10B981', pairs: [] },
        topaz: { name: '🟡 บุษราคัมแสง (รหัส: 4289)', color: '#F59E0B', pairs: [] }
      };
      const keys = Object.keys(VARIANTS);
      for (let i = 0; i < MKT_TEAM.length; i += 2) {
        const colorKey = keys[Math.floor(i / 2) % 4];
        groups[colorKey].pairs.push({
          sun: MKT_TEAM[i], 
          moon: MKT_TEAM[i+1] || "(รอคนสีเดียวกัน)"
        });
      }
      return groups;
    }, []);

    const StarfieldBG = () => {
      const stars = useMemo(() => Array.from({length: 40}, () => ({
        x: Math.random() * 100, y: Math.random() * 100, s: 1 + Math.random() * 3, d: Math.random() * 3, dur: 1.5 + Math.random() * 2
      })), []);
      return <div className="starfield">{stars.map((s, i) => <div key={i} className="star" style={{ left: `${s.x}%`, top: `${s.y}%`, width: `${s.s}px`, height: `${s.s}px`, animationDelay: `${s.d}s`, animationDuration: `${s.dur}s` }} />)}</div>;
    };

    if (!isLoggedIn) {
      return (
        <div className="page flex items-center justify-center h-full">
          <StarfieldBG />
          <div className="login-box fade-in relative z-20">
            <div style={{fontSize:'72px', marginBottom:'16px'}}>🧿</div>
            <h1 className="text-3xl font-bold mb-2 text-[var(--ink)]">เปิดม่านชะตา</h1>
            <p className="mb-6 opacity-80 text-[var(--ink-2)]">กรุณา <b>ใส่ชื่อจริงเท่านั้น (ไม่ต้องใส่นามสกุล)</b> เพื่อรับมอบธาตุและคู่ภาคีประจำตัว</p>
            <form onSubmit={e => { e.preventDefault(); processLogin(inputName); }}>
              <input autoFocus required className="login-input" placeholder="พิมพ์ชื่อจริงของคุณที่นี่..." value={inputName} onChange={e=>setInputName(e.target.value)} />
              <button className="login-btn" type="submit" onClick={()=>playSound('click')}>รับคำทำนายและเข้าสู่ค่ายกล ✨</button>
            </form>
            <div className="mt-6 text-sm font-semibold p-3 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-xl leading-relaxed text-left border border-red-200 dark:border-red-800 login-warning">
              ⚠️ กฎแห่งเวทมนตร์: กรุณา <b>ใส่ชื่อจริงเท่านั้น (ไม่ต้องใส่นามสกุล)</b> เพราะดวงดาวได้ผูกชะตากับชื่อของคุณไว้แล้ว ตามหลักจักรวาลวิทยา
            </div>
          </div>
        </div>
      );
    }

    const varData = VARIANTS[colorKey];
    // Check if the current user is a manager
    const isManagerLevel = MKT_MANAGERS.some(m => playerName.toLowerCase().includes(m.toLowerCase()));
    
    const isSun = role === 'sun';
    const oppRole = isSun ? '🌙 ภาคีจันทรา' : '☀️ ภาคีสุริยัน';

    return (
      <div className="page" onPointerMove={pm} onPointerUp={()=>dragRef.current.dragging=false} onPointerLeave={()=>dragRef.current.dragging=false}>
        <StarfieldBG />
        {toast && <div className="toast-msg">{toast}</div>}
        
        <header className="topbar">
          <div className="brand"><span style={{width:'10px', height:'10px', background:'var(--team-color)', borderRadius:'50%'}}/>🔮 MKT สายมู</div>
          <div className="top-actions">
            <button className="theme-toggle" onClick={()=>{playSound('click');setIsDarkMode(!isDarkMode)}}> {isDarkMode?'☀️':'🌙'} </button>
            {unlockedState === 'locked' && <div className="team-badge"><div className="team-badge-icon">{isSun?'☀️':'🌙'}</div>ภาคี{isSun?'สุริยัน':'จันทรา'}</div>}
          </div>
        </header>

        {showTransition ? (
          <div className="transition-screen fade-in">
            <div className="transition-orb-wrap"><div className="transition-orb"></div><div className="transition-orb-ring"></div></div>
            <div className="transition-text">🔮 กำลังอ่านดวงดาว...</div>
            <div className="transition-sub">จักรวาลกำลังถอดรหัสชะตาของคุณ</div>
          </div>
        ) : unlockedState !== 'locked' ? (
          <div className="fade-in text-center pb-12 w-full max-w-4xl mx-auto flex flex-col items-center">
            {<ConfettiEffect />}
            
            {/* โชว์ตารางจับคู่ให้เฉพาะคนที่เป็นระดับผู้จัดการเห็นเท่านั้น */}
            {isManagerLevel && (
              <div className="manager-box mx-auto mb-12 fade-in" style={{maxWidth: '900px'}}>
                <h3 className="text-3xl font-bold text-yellow-400 mb-4">👁️ มิติผู้คุมกฎ (Manager Mode)</h3>
                <p className="mb-8 text-slate-300 text-lg">
                  สวัสดีครับคุณ {playerName}! โหมดนี้สงวนไว้สำหรับผู้ดูแลระบบ<br/>
                  ตารางด้านล่างคือรหัสและโพยจับคู่ลูกทีมที่ <strong>"กระจายให้ข้ามหน่วยงานกัน"</strong> เรียบร้อยแล้ว
                </p>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 text-left">
                  {Object.values(pairingsByColor).map((group, idx) => (
                    <div key={idx} className="bg-black/30 rounded-2xl p-6 border border-white/10 shadow-lg">
                      <h4 className="font-bold text-xl mb-4" style={{color: group.color}}>{group.name}</h4>
                      <table className="w-full text-sm">
                        <thead>
                          <tr className="text-slate-400 border-b border-white/10">
                            <th className="pb-2 w-1/2 font-semibold">☀️ ภาคีสุริยัน<br/><span className="text-[10px] opacity-70">ส่วนการตลาดฯ</span></th>
                            <th className="pb-2 w-1/2 font-semibold">🌙 ภาคีจันทรา<br/><span className="text-[10px] opacity-70">ส่วนลูกค้าสัมพันธ์ฯ</span></th>
                          </tr>
                        </thead>
                        <tbody>
                          {group.pairs.map((p, i) => (
                            <tr key={i} className="border-b border-white/5 last:border-0 hover:bg-white/5 transition-colors">
                              <td className="py-3 text-yellow-100">{p.sun}</td>
                              <td className="py-3 text-slate-200">{p.moon}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="mb-10 text-center w-full">
              <div className="text-6xl mb-4 drop-shadow-lg">✨🔮✨</div>
              <h1 className="text-4xl md:text-5xl font-bold mb-2">{isManagerLevel ? "ดวงชะตาของผู้คุมกฎ" : "ผนึกถูกทำลายแล้ว!"}</h1>
              <p className="text-lg opacity-80">ขอต้อนรับเข้าสู่มิติแห่งคำทำนาย</p>
            </div>
            
            {/* GRID FLIPPER - Completely fixes height jumping issue */}
            <div className="tarot-reveal-wrapper mx-auto">
              <div className={`tarot-flipper ${cardRevealed ? '' : 'face-down'}`}>
                <div id="tarot-card" className="tarot-card text-left">
                  <div className="tarot-inner">
                    <div className="border-b border-yellow-600/30 pb-4 mb-4 flex justify-between items-center">
                      <span className="bg-yellow-500/10 text-yellow-400 px-4 py-1.5 rounded-full font-bold text-sm border border-yellow-500/30 tarot-badge">{varData.icon} ศิลา{varData.name}</span>
                      <span className="font-bold text-white text-lg border-b-2 border-[var(--team-color)] id-name">{playerName}</span>
                    </div>
                    <h3 className="text-2xl font-bold text-yellow-400 mb-6 tarot-card-title">{PERSONAL_FORTUNES[fortuneIndex].title}</h3>
                    <div className="space-y-4 mb-6">
                      <div className="bg-black/20 p-4 rounded-xl border-l-4 border-green-500 tarot-section"><strong className="text-green-400 block mb-1">💼 งาน/เงิน</strong><p>{PERSONAL_FORTUNES[fortuneIndex].work}</p></div>
                      <div className="bg-black/20 p-4 rounded-xl border-l-4 border-red-400 tarot-section"><strong className="text-red-400 block mb-1">💖 ความรัก</strong><p>{PERSONAL_FORTUNES[fortuneIndex].love}</p></div>
                      <div className="bg-black/20 p-4 rounded-xl border-l-4 border-blue-400 tarot-section"><strong className="text-blue-400 block mb-1">💪 สุขภาพ</strong><p>{PERSONAL_FORTUNES[fortuneIndex].health}</p></div>
                      <div className="bg-black/20 p-4 rounded-xl border-l-4 border-yellow-500 tarot-section"><strong className="text-yellow-400 block mb-1">🌟 ทริค</strong><p>{PERSONAL_FORTUNES[fortuneIndex].extra}</p></div>
                    </div>
                    <div className="bg-yellow-500/10 p-4 text-center rounded-xl border border-yellow-500/30 text-yellow-200 text-sm">
                      ✨ เนื้อคู่มีอักษร <span className="bg-white/20 px-2 py-0.5 rounded font-bold mx-1 text-white">{soulmateLetter}</span> อยู่ในชื่อ ✨
                    </div>
                    <div className="mt-8 pt-6 border-t border-yellow-600/30 text-center">
                      <div className="text-sm font-bold uppercase tracking-widest text-purple-300 mb-4">เลขนำโชคประจำวัน</div>
                      <div className="inline-flex items-center justify-center gap-4 bg-gradient-to-r from-yellow-400 to-yellow-600 text-black px-8 py-3 rounded-xl font-black text-4xl shadow-lg">{luckyNumber} <span>{luckyEmoji}</span></div>
                      <div className="mt-6 text-[10px] text-white/30 tracking-widest uppercase">🔮 MKT · Team Co-op 2026</div>
                    </div>
                  </div>
                </div>
                
                <div className="tarot-card-back">
                  <div className="tarot-back-inner">
                    <div className="text-7xl mb-6 drop-shadow-xl animate-pulse">🔮</div>
                    <div className="text-xl font-bold text-yellow-400 mb-2">กำลังเปิดไพ่ดวงชะตา...</div>
                    <div className="text-sm text-purple-200 opacity-70">โปรดรอสักครู่</div>
                  </div>
                </div>
              </div>
            </div>

            {cardRevealed && (
              <div className="fade-in mt-6 w-full max-w-lg">
                <div className="flex flex-col sm:flex-row gap-4 justify-center items-center mb-10 w-full action-buttons">
                  <button onClick={handleDownload} className="download-btn">📥 บันทึกรูป</button>
                  <button onClick={handleShare} className="share-btn">📲 แชร์ลงไลน์กลุ่มกันเถอะ</button>
                </div>
                <div className="bg-[var(--card-bg)] p-6 rounded-2xl border-2 border-dashed border-[var(--team-color)] text-sm mb-12 shadow-sm text-center uniqueness-note">
                  💡 <strong>ความลับแห่งดวงดาว:</strong> ระบบนี้มีรูปแบบชะตาที่แตกต่างกันถึง <strong>720,000 รูปแบบ</strong> (โอกาสซ้ำกันมีเพียง 0.00013%)<br/>
                  แชร์ไพ่ใบนี้ลงกรุ๊ปสิ! หากบังเอิญเจอใครในทีมที่ได้ <strong>ไพ่และสัญลักษณ์</strong> ตรงกับคุณเป๊ะๆ แสดงว่าชะตาต้องกันสุดๆ!
                </div>
              </div>
            )}

            <div className="text-left w-full mt-4">
              <h2 className="text-3xl font-bold mb-8 text-center">เตรียมพบกับกิจกรรมดีๆ เร็วๆ นี้ 👇</h2>
              <div className="grid md:grid-cols-2 gap-8">
                {ACTIVITIES.map(a => (
                  <div key={a.id} className="bg-[var(--card-bg)] p-8 rounded-3xl shadow-sm border-t-8 transition-transform hover:-translate-y-2" style={{borderColor: a.color}}>
                    <div className="text-5xl mb-6 drop-shadow-sm">{a.icon}</div>
                    {a.tag && <div className="text-xs font-bold uppercase tracking-widest mb-3 ac-tag" style={{color: a.deep}}>{a.tag}</div>}
                    <h3 className="text-2xl font-bold mb-4 text-[var(--ink)]">{a.name}</h3>
                    <div className="flex flex-col gap-3 py-4 border-y border-[var(--ink)]/10 mb-4">
                      <div className="flex gap-4 items-baseline"><span className="text-[10px] font-bold uppercase tracking-widest text-[var(--ink-2)] opacity-70 w-12">When</span><span className="font-semibold">{a.when}</span></div>
                      <div className="flex gap-4 items-baseline"><span className="text-[10px] font-bold uppercase tracking-widest text-[var(--ink-2)] opacity-70 w-12">Where</span><span className="font-semibold">{a.where}</span></div>
                    </div>
                    <p className="text-[var(--ink-2)] leading-relaxed blurb">{a.blurb}</p>
                  </div>
                ))}
              </div>
            </div>

            <button onClick={()=>{playSound('click'); localStorage.clear(); window.location.reload();}} className="mt-16 px-8 py-4 rounded-full border-2 border-[var(--ink-2)]/30 text-[var(--ink-2)] font-bold hover:bg-[var(--ink-2)] hover:text-white transition-all reset-btn">ออกจากระบบ</button>
          </div>
        ) : (
          <main className="fade-in w-full max-w-4xl mx-auto flex flex-col justify-center flex-1 pb-12">
            <div className="text-center mb-10">
              <div className="inline-flex items-center gap-2 bg-white px-6 py-2 rounded-full font-bold shadow-sm mb-6 border-2 border-purple-200 text-[var(--ink)]">✨ ยินดีต้อนรับ ผู้ถือครองศิลา {playerName}</div>
              <h1 className="text-3xl md:text-4xl font-bold mb-4 leading-tight">ค่ายกลนี้ไม่อาจแก้ได้เพียงลำพัง</h1>
              <p className="text-lg opacity-80 max-w-2xl mx-auto">ชะตากำหนดให้คุณถือครอง <strong style={{color:varData.color}}>{varData.icon} ศิลา{varData.name}</strong> รีบออกตามหา <strong>{oppRole}</strong> ที่มีศิลาสีเดียวกัน เพื่อนำรหัสมารวมกันปลดผนึก!</p>
            </div>

            <div className="flex flex-col md:flex-row gap-12 items-center justify-center">
              {/* 3D Cube Interactive */}
              <div className="stage-container">
                <div className="stage" onPointerDown={e=>{dragRef.current={dragging:true, x:e.clientX, y:e.clientY}}}>
                  <div className="cube-perspective">
                    <div className="cube" style={{ transform: `rotateX(${rx}deg) rotateY(${ry}deg)` }}>
                      {generateFaces(role, varData).map((f, i) => (
                        <div key={i} className="face" style={{ transform: `rotateX(${f.rx}deg) rotateY(${-f.ry}deg) translateZ(130px)`, background: f.bg, color: f.fg }}>{f.content}</div>
                      ))}
                    </div>
                  </div>
                  <div className="absolute -bottom-6 bg-white/90 text-purple-900 px-6 py-2 rounded-full text-sm font-bold shadow-sm backdrop-blur-sm pointer-events-none border border-purple-200">✨ ลากเพื่อหมุนศิลาเวทมนตร์ ✨</div>
                </div>
              </div>

              {/* Keypad */}
              <div className="keypad-section relative">
                <h3 className="text-center font-bold text-lg mb-6 tracking-wide text-[var(--ink-2)]">กรอกรหัสปลดผนึกศิลา <span style={{color: varData.color}}>{varData.name}</span></h3>
                <div className={`pin-display ${errorShake?'shake':''}`}>
                  {[0,1,2,3].map(i => <div key={i} className={`pin-dot ${pin.length>i?'filled':''}`}>{pin[i]||''}</div>)}
                </div>
                <div className="keypad">
                  {[1,2,3,4,5,6,7,8,9].map(n => <button key={n} onClick={()=>handlePin(n.toString())}>{n}</button>)}
                  <div/>
                  <button onClick={()=>handlePin('0')}>0</button>
                  <button onClick={()=>{playSound('click');setPin(p=>p.slice(0,-1))}} className="del">⌫</button>
                </div>
                
                <button onClick={handleToggleRiddle} className="w-full mt-8 py-4 rounded-2xl border-2 border-dashed border-[var(--team-color)] text-[var(--team-color)] font-bold hover:bg-[var(--team-color)]/10 transition-colors riddle-btn">🔮 ฝืนชะตาจักรวาล (แก้ปริศนาสุดหิน)</button>
                
              </div>
            </div>

            {/* FULL SCREEN MODAL RIDDLE */}
            {showRiddle && (
              <div className="riddle-modal-overlay">
                <div className="riddle-modal fade-in">
                  <div className="flex justify-between items-start mb-6">
                    <h4 className="font-bold text-2xl text-yellow-400">⚠️ จักรวาลไม่ใจดีขนาดนั้น!</h4>
                    <button onClick={handleToggleRiddle} className="bg-white/10 hover:bg-white/20 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold transition-colors">✕</button>
                  </div>
                  <p className="text-base opacity-90 leading-relaxed mb-6">หากไม่อยากลุกไปตามหาภาคีตรงข้าม จงใช้สมองแก้สมการเพื่อหา <strong>"รหัสลับ"</strong> ด้วยตนเอง</p>
                  <div className="bg-yellow-500/20 text-yellow-300 p-4 rounded-xl text-sm leading-relaxed mb-8 border border-yellow-500/30">
                    💡 <strong>คำใบ้:</strong> คำตอบของสมการคือตัวเลข 1 หลัก ที่คุณขาดหายไป นำไปรวมกับเลขที่คุณมีแล้วกรอกที่ Keypad
                  </div>
                  
                  <div className="mb-6 pb-6 border-b border-white/10">
                    <div className="text-yellow-400 font-bold mb-3 text-lg">รหัสหลักที่ {isSun?'2':'1'}:</div>
                    {ALIEN_RIDDLES[isSun?varData.pin[1]:varData.pin[0]][riddleIndices.idx1]}
                  </div>
                  <div>
                    <div className="text-yellow-400 font-bold mb-3 text-lg">รหัสหลักที่ {isSun?'4':'3'}:</div>
                    {ALIEN_RIDDLES[isSun?varData.pin[3]:varData.pin[2]][riddleIndices.idx2]}
                  </div>
                </div>
              </div>
            )}
          </main>
        )}
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
</script>
</body>
</html>
